[workspace]
resolver = "2"
members = [
    "kyb-attestation-registry",
    "insurance-record",
    "upgrade-tests",
]

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = "=22.0.11"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
