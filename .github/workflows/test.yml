name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs; the tag is noted for review.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml (channel, wasm32v1-none, rustfmt, clippy).
      - name: Install toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Release builds use the same Stellar CLI as testnet deployments, so the
      # hashes printed below are comparable with the on-chain WASM hash.
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: 28.0.0
          STELLAR_CLI_SHA256: 207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libdbus-1-3 libudev1
          tarball="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${tarball}"
          echo "${STELLAR_CLI_SHA256}  ${tarball}" | sha256sum --check
          sudo tar -xzf "$tarball" -C /usr/local/bin stellar
          stellar version

      - name: Build WASM
        run: stellar contract build --locked

      - name: WASM hashes
        run: |
          {
            echo '```'
            sha256sum target/wasm32v1-none/release/*.wasm
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
